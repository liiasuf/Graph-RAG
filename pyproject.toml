[project]
name = "rag-system"
version = "0.2.0"
description = "GraphRAG vs RAG - knowledge graphs over vector indexes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets>=2.19.0",
  "numpy>=1.26.0",
  "pyyaml>=6.0.1",
  "pydantic>=2.6.0",
  "tqdm>=4.66.0",
  "rich>=13.7.0",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "pdfplumber>=0.11.0",
  "docx2txt>=0.8",
  "matplotlib>=3.8.0",
  "networkx>=3.2.0",
  "scipy>=1.12.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
   "ruff>=0.6.0",
   "pytest>=8.0.0",
]
neo4j = [
   "neo4j>=5.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

