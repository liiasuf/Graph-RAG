services:
  neo4j:
    image: neo4j:5-community
    container_name: rag_system_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" 
      - "7687:7687" 
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password_change_me
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_memory_heap_max__size=3G
      - NEO4J_dbms_memory_transaction_total_max=2500m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:


