experiment_name: hotpotqa_rag_baseline_ablation
output_dir: experiments

dataset:
  name: hotpotqa

hotpotqa:
  subset: distractor
  train_split: train
  eval_split: validation
  max_train_examples: 20000
  max_corpus_docs: 3000
  max_corpus_chunks: 20000
  max_eval_examples: 60
  seed: 42

chunking:
  max_words: 220
  overlap_words: 40

embeddings:
  base_url: http://127.0.0.1:1234/v1    
  api_key: LLM_API_KEY   
  model: text-embedding-nomic-embed-text-v1.5   
  batch_size: 64
  use_cache: true
  cache_path: cache/embeddings_bge_m3_ablations.json

index:
  backend: numpy_cosine

retrieval:
  top_k: 8
  mode: vector

graph:
  title_as_entity: true
  max_entity_words: 5
  min_entity_chars: 3
  max_hops: 1
  max_neighbors_per_hop: 20
  max_candidate_chunks: 300

llm:
  base_url: http://127.0.0.1:1234/v1    
  api_key: LLM_API_KEY   
  model: openai/gpt-oss-20b   
  temperature: 0.0
  max_tokens: 128
  timeout_s: 120.0
  max_context_chars: 12000
