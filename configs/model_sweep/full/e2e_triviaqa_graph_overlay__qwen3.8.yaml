experiment_name: triviaqa_graph_overlay__qwen3.8
output_dir: /Users/liiasufiianova/itmo/нир/rag_system/experiments/model_sweep
dataset:
  name: triviaqa
triviaqa:
  eval_split: validation
  max_corpus_docs: null
  max_eval_examples: 500
chunking:
  max_words: 220
  overlap_words: 40
embeddings:
  base_url: http://127.0.0.1:1234/v1
  api_key: LLM_API_KEY
  model: text-embedding-nomic-embed-text-v1.5
  batch_size: 64
  use_cache: true
  cache_path: cache/embeddings_bge_m3_e2e_triviaqa_graph_overlay.json
index:
  backend: numpy_cosine
retrieval:
  top_k: 8
  mode: graph_neo4j
graph:
  title_as_entity: true
  max_entity_words: 5
  min_entity_chars: 3
  max_hops: 1
  max_neighbors_per_hop: 20
  max_candidate_chunks: 300
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: neo4j_password_change_me
    database: neo4j
    clear_before_build: true
    batch_size: 1000
llm:
  base_url: http://127.0.0.1:1234/v1
  api_key: LLM_API_KEY
  model: openai/gpt-oss-20b
  temperature: 0.0
  max_tokens: 128
  timeout_s: 120.0
  max_context_chars: 12000
